<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 450' width='100%' height='100%'>
  <defs>
    <linearGradient id='studioBg' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#0f172a'/>
      <stop offset='50%' stop-color='#1e293b'/>
      <stop offset='100%' stop-color='#090d16'/>
    </linearGradient>
    <linearGradient id='redBar' x1='0%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='#991b1b'/>
      <stop offset='50%' stop-color='#dc2626'/>
      <stop offset='100%' stop-color='#b91c1c'/>
    </linearGradient>
    <linearGradient id='suitGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#f8fafc'/>
      <stop offset='100%' stop-color='#cbd5e1'/>
    </linearGradient>
    <filter id='shadow' x='-20%' y='-20%' width='140%' height='140%'>
      <feDropShadow dx='0' dy='4' stdDeviation='6' flood-color='#000000' flood-opacity='0.6'/>
    </filter>
  </defs>

  <!-- Studio Background Base -->
  <rect width='800' height='450' fill='url(#studioBg)'/>

  <!-- Subtle Studio Backdrop Grid -->
  <g opacity='0.06'>
    <circle cx='400' cy='220' r='200' fill='#ffffff'/>
    <line x1='0' y1='100' x2='800' y2='100' stroke='#ffffff' stroke-width='1'/>
    <line x1='0' y1='200' x2='800' y2='200' stroke='#ffffff' stroke-width='1'/>
    <line x1='0' y1='300' x2='800' y2='300' stroke='#ffffff' stroke-width='1'/>
    <line x1='200' y1='0' x2='200' y2='450' stroke='#ffffff' stroke-width='1'/>
    <line x1='400' y1='0' x2='400' y2='450' stroke='#ffffff' stroke-width='1'/>
    <line x1='600' y1='0' x2='600' y2='450' stroke='#ffffff' stroke-width='1'/>
  </g>

  <!-- TOP NEWS HEADER BAR -->
  <rect x='0' y='0' width='800' height='46' fill='#ffffff'/>
  <!-- Red Box Text RAWF -->
  <rect x='0' y='0' width='110' height='46' fill='#b91c1c'/>
  <text x='55' y='31' font-family='Arial Black, sans-serif' font-weight='900' font-size='22' fill='#ffffff' text-anchor='middle'>RAWF</text>
  <!-- Organization Headline -->
  <text x='130' y='31' font-family='Arial Black, sans-serif' font-weight='900' font-size='22' fill='#7f1d1d' letter-spacing='0.5'>Raid Action Wing Foundation</text>
  <!-- News Tag -->
  <rect x='670' y='0' width='130' height='46' fill='#ea580c'/>
  <text x='735' y='21' font-family='Arial Black, sans-serif' font-weight='900' font-size='12' fill='#ffffff' text-anchor='middle'>CAPPU</text>
  <text x='735' y='37' font-family='Arial Black, sans-serif' font-weight='900' font-size='14' fill='#ffffff' text-anchor='middle'>NEWS</text>

  <!-- SUB TICKER BAR (Dark Green / Gold Text) -->
  <rect x='0' y='46' width='800' height='26' fill='#047857'/>
  <text x='400' y='64' font-family='Arial, sans-serif' font-weight='bold' font-size='13' fill='#fef08a' text-anchor='middle'>
    श्री नीलेश ठाकर, राष्ट्रीय डायरेक्टर, RAWF • संपर्क - 8530341193 • Registered with MSME &amp; NITI Aayog
  </text>

  <!-- MAIN STUDIO SPEAKER BROADCAST VIEW (NO LOGO) -->
  <g transform='translate(250, 85)'>
    <!-- Video Monitor Border -->
    <rect x='0' y='0' width='300' height='255' rx='12' fill='#1e293b' stroke='#334155' stroke-width='2' filter='url(#shadow)'/>
    <rect x='2' y='2' width='296' height='251' rx='10' fill='#0ea5e9' opacity='0.12'/>

    <!-- Formal Attire / Shoulders -->
    <path d='M30,251 C40,175 75,150 150,150 C225,150 260,175 270,251 Z' fill='url(#suitGrad)'/>
    <!-- Black Tie -->
    <polygon points='144,155 156,155 160,251 140,251' fill='#0f172a'/>
    <polygon points='142,150 158,150 155,164 145,164' fill='#1e293b'/>

    <!-- Head & Hair -->
    <ellipse cx='150' cy='95' rx='45' ry='50' fill='#d97706' opacity='0.85'/>
    <path d='M105,82 C115,48 185,48 195,82 Z' fill='#0f172a'/>

    <!-- Dark Sunglasses (Key feature from attached video) -->
    <rect x='120' y='82' width='26' height='17' rx='3' fill='#09090b'/>
    <rect x='154' y='82' width='26' height='17' rx='3' fill='#09090b'/>
    <rect x='144' y='87' width='12' height='4' fill='#09090b'/>
    <!-- Glasses Glare Highlights -->
    <line x1='124' y1='84' x2='134' y2='94' stroke='#ffffff' stroke-width='1.5' opacity='0.6'/>
    <line x1='158' y1='84' x2='168' y2='94' stroke='#ffffff' stroke-width='1.5' opacity='0.6'/>

    <!-- Mustache & Chin Mask -->
    <path d='M138,112 Q150,115 162,112' stroke='#0f172a' stroke-width='4' fill='none'/>
    <path d='M125,126 Q150,140 175,126' stroke='#0f172a' stroke-width='6' fill='none'/>

    <!-- Microphone on tie -->
    <circle cx='150' cy='175' r='5' fill='#334155'/>
    <line x1='150' y1='180' x2='150' y2='251' stroke='#475569' stroke-width='1.5'/>

    <!-- Red LIVE Broadcast Pill -->
    <rect x='12' y='12' width='58' height='20' rx='4' fill='#dc2626'/>
    <circle cx='22' cy='22' r='4' fill='#ffffff'/>
    <text x='44' y='26' font-family='Arial Black, sans-serif' font-size='10' font-weight='900' fill='#ffffff' text-anchor='middle'>LIVE</text>
  </g>

  <!-- LOWER THIRD NEWS HEADLINE (NO LOGO) -->
  <g transform='translate(0, 350)'>
    <!-- Red Banner Bar -->
    <rect x='0' y='0' width='800' height='55' fill='url(#redBar)' filter='url(#shadow)'/>
    <rect x='0' y='0' width='14' height='55' fill='#f59e0b'/>
    
    <text x='35' y='36' font-family='Arial, sans-serif' font-weight='900' font-size='24' fill='#ffffff' letter-spacing='0.5'>
      श्री नीलेश ठाकर, राष्ट्रीय डायरेक्टर, RAWF
    </text>

    <!-- Sub Headline Ticker -->
    <rect x='0' y='55' width='800' height='45' fill='#0f172a'/>
    <!-- White Box Ticker -->
    <rect x='15' y='62' width='380' height='30' rx='4' fill='#ffffff'/>
    <text x='205' y='82' font-family='Arial, sans-serif' font-weight='bold' font-size='14' fill='#b91c1c' text-anchor='middle'>
      छापा कार्यवाही विभाग, RAWF में आपका स्वागत है
    </text>

    <!-- Helpline & Website Info -->
    <text x='415' y='82' font-family='Arial, sans-serif' font-weight='bold' font-size='13' fill='#f8fafc'>
      संपर्क: <tspan fill='#38bdf8'>8530341193</tspan> • <tspan fill='#facc15'>www.raidactionwing.in</tspan>
    </text>
  </g>

  <!-- CENTER PLAY BUTTON OVERLAY -->
  <g transform='translate(400, 215)'>
    <circle cx='0' cy='0' r='46' fill='#000000' opacity='0.65' filter='url(#shadow)'/>
    <circle cx='0' cy='0' r='38' fill='#dc2626' stroke='#ffffff' stroke-width='3.5'/>
    <polygon points='-9,-16 18,0 -9,16' fill='#ffffff'/>
    <rect x='-50' y='46' width='100' height='24' rx='12' fill='#0f172a' stroke='#ffffff' stroke-width='1.5'/>
    <text x='0' y='62' font-family='Arial, sans-serif' font-weight='bold' font-size='11' fill='#ffffff' text-anchor='middle'>▶ 01:22 MIN</text>
  </g>
</svg>